name: Release Docker Images Nightly

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "附加到标准镜像 tag 后的可选后缀，例如 nightly、B021"
        required: false
        type: string
        default: nightly
      push_images:
        description: "是否登录 registry 并推送镜像；在 fork 中无凭据时可关闭"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-docker-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  # 华为云 SWR 镜像仓库。
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  IMAGE_REPOSITORY: swr.cn-north-4.myhuaweicloud.com/opentile/triton

jobs:
  deps:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Resolve release image inputs
        id: image
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          info = json.loads(Path("cmake/release-image-info.json").read_text())
          fields = {"schema_version", "triton_version", "source_hash", "llvm_hash", "patches", "cann", "python_version"}
          if set(info) != fields or type(info["schema_version"]) is not int or info["schema_version"] != 1:
              raise SystemExit("Invalid release image schema")
          for key in ("source_hash", "llvm_hash"):
              if not isinstance(info[key], str) or re.fullmatch(r"[0-9a-f]{40}", info[key]) is None:
                  raise SystemExit(f"{key} must be an immutable full SHA")
          for key, pattern in (("triton_version", r"[0-9]+\.[0-9]+\.[0-9]+(?:\.post[0-9]+)?"),
                               ("python_version", r"[0-9]+\.[0-9]+\.[0-9]+")):
              if not isinstance(info[key], str) or re.fullmatch(pattern, info[key]) is None:
                  raise SystemExit(f"Invalid {key}")
          if not isinstance(info["patches"], list):
              raise SystemExit("Invalid release patch manifest")
          for patch in info["patches"]:
              if (not isinstance(patch, dict) or set(patch) != {"file", "sha256"}
                  or not isinstance(patch["file"], str) or re.fullmatch(r"llvm_patch_[A-Za-z0-9_.-]+\.patch", patch["file"]) is None
                  or not isinstance(patch["sha256"], str) or re.fullmatch(r"[0-9a-f]{64}", patch["sha256"]) is None):
                  raise SystemExit("Invalid release patch entry")
          names = [patch["file"] for patch in info["patches"]]
          if names != sorted(set(names)):
              raise SystemExit("Release patches must be unique and sorted")
          runtime = json.loads(Path("cmake/ascend-runtime-info.json").read_text())
          groups = [group for group in runtime["runtimes"] if group["cann"] == info["cann"]]
          if len(groups) != 1 or groups[0]["status"] == "planned":
              raise SystemExit("Release image must select one existing runtime group")
          image = dict(info, torch=groups[0]["torch"], torch_npu=groups[0]["torch_npu"],
                       python_series=".".join(info["python_version"].split(".")[:2]))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("image=" + json.dumps(image, separators=(",", ":")) + "\n")

  build:
    needs: deps
    name: Build ${{ matrix.device_type }}-${{ matrix.os.name }}-${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      PUSH_IMAGE: ${{ inputs.push_images && 'true' || 'false' }}
      TRITON_ASCEND_VERSION: ${{ fromJSON(needs.deps.outputs.image).triton_version }}
      TRITON_ASCEND_SOURCE_SHA: ${{ fromJSON(needs.deps.outputs.image).source_hash }}
      CANN_VERSION: ${{ fromJSON(needs.deps.outputs.image).cann }}
      PYTORCH_VERSION: ${{ fromJSON(needs.deps.outputs.image).torch }}
      TORCH_NPU_VERSION: ${{ fromJSON(needs.deps.outputs.image).torch_npu }}
      PYTHON_VERSION: ${{ fromJSON(needs.deps.outputs.image).python_version }}
      PYTHON_SERIES: ${{ fromJSON(needs.deps.outputs.image).python_series }}
    strategy:
      fail-fast: false
      matrix:
        device_type: ["910b", "950", "a3"]
        os:
          - name: debian12
            base_image: debian:12
          - name: ubuntu24.04
            base_image: ubuntu:24.04
          - name: openeuler24.03
            base_image: openeuler/openeuler:24.03-lts
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Huawei Cloud SWR
        if: ${{ env.PUSH_IMAGE == 'true' }}
        uses: huaweicloud/swr-login@v2.1.0
        with:
          region: cn-north-4
          access-key-id: ${{ secrets.HUAWEI_CLOUD_AK }}
          access-key-secret: ${{ secrets.HUAWEI_CLOUD_SK }}

      - name: Generate image tags
        id: tags
        run: |
          base_tag="${TRITON_ASCEND_VERSION}-cann${CANN_VERSION}-torch_npu${TORCH_NPU_VERSION}-${{ matrix.device_type }}-${{ matrix.os.name }}-py${PYTHON_SERIES}"
          arch_tag="${base_tag}-${{ matrix.platform.arch }}"
          echo "base_tag=${base_tag}" >> "${GITHUB_OUTPUT}"
          echo "arch_tag=${arch_tag}" >> "${GITHUB_OUTPUT}"
          echo "Architecture image: ${IMAGE_REPOSITORY}:${arch_tag}"
          echo "Final image:        ${IMAGE_REPOSITORY}:${base_tag}"

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/triton_ascend-cann-torch_npu.Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          load: false
          no-cache: true
          outputs: ${{ env.PUSH_IMAGE == 'true' && 'type=registry,oci-mediatypes=false' || '' }}
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.tags.outputs.arch_tag }}
          labels: |
            org.opencontainers.image.title=Triton-Ascend
            org.opencontainers.image.description=Triton-Ascend ${{ env.TRITON_ASCEND_VERSION }} for ${{ matrix.device_type }} on ${{ matrix.os.name }} (${{ matrix.platform.arch }})
            org.opencontainers.image.version=${{ steps.tags.outputs.arch_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            BASE_IMAGE=${{ matrix.os.base_image }}
            DEVICE_TYPE=${{ matrix.device_type }}
            TRITON_ASCEND_VERSION=${{ env.TRITON_ASCEND_VERSION }}
            TRITON_ASCEND_SOURCE_SHA=${{ env.TRITON_ASCEND_SOURCE_SHA }}
            CANN_VERSION=${{ env.CANN_VERSION }}
            PYTORCH_VERSION=${{ env.PYTORCH_VERSION }}
            TORCH_NPU_VERSION=${{ env.TORCH_NPU_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            PYTHON_SERIES=${{ env.PYTHON_SERIES }}

  merge:
    name: Merge ${{ matrix.device_type }}-${{ matrix.os.name }}
    needs: [deps, build]
    if: ${{ inputs.push_images }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG_SUFFIX: ${{ inputs.tag_suffix }}
      TRITON_ASCEND_VERSION: ${{ fromJSON(needs.deps.outputs.image).triton_version }}
      CANN_VERSION: ${{ fromJSON(needs.deps.outputs.image).cann }}
      TORCH_NPU_VERSION: ${{ fromJSON(needs.deps.outputs.image).torch_npu }}
      PYTHON_SERIES: ${{ fromJSON(needs.deps.outputs.image).python_series }}
    strategy:
      fail-fast: false
      matrix:
        device_type: ["910b", "950", "a3"]
        os:
          - name: debian12
          - name: ubuntu24.04
          - name: openeuler24.03

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Huawei Cloud SWR
        uses: huaweicloud/swr-login@v2.1.0
        with:
          region: cn-north-4
          access-key-id: ${{ secrets.HUAWEI_CLOUD_AK }}
          access-key-secret: ${{ secrets.HUAWEI_CLOUD_SK }}

      - name: Generate image tag
        id: tags
        run: |
          base_tag="${TRITON_ASCEND_VERSION}-cann${CANN_VERSION}-torch_npu${TORCH_NPU_VERSION}-${{ matrix.device_type }}-${{ matrix.os.name }}-py${PYTHON_SERIES}"
          echo "base_tag=${base_tag}" >> "${GITHUB_OUTPUT}"

      - name: Create multi-arch manifest
        shell: bash
        env:
          BASE_TAG: ${{ steps.tags.outputs.base_tag }}
        run: |
          set -euo pipefail

          amd64_image="${IMAGE_REPOSITORY}:${BASE_TAG}-amd64"
          arm64_image="${IMAGE_REPOSITORY}:${BASE_TAG}-arm64"
          final_image="${IMAGE_REPOSITORY}:${BASE_TAG}"

          docker buildx imagetools inspect "${amd64_image}" >/dev/null
          docker buildx imagetools inspect "${arm64_image}" >/dev/null

          destinations=("${final_image}")
          if [[ -n "${TAG_SUFFIX}" ]]; then
            destinations+=("${final_image}-${TAG_SUFFIX}")
          fi

          tags=()
          for destination in "${destinations[@]}"; do
            tags+=(-t "${destination}")
          done

          if ! docker buildx imagetools create \
            "${tags[@]}" \
            "${amd64_image}" \
            "${arm64_image}"; then
            echo "imagetools failed; falling back to docker manifest"
            for destination in "${destinations[@]}"; do
              docker manifest create --amend "${destination}" "${amd64_image}" "${arm64_image}"
              docker manifest push "${destination}"
            done
          fi

          echo "Published multi-arch tags:"
          printf '  %s\n' "${destinations[@]}"
